# =============================================================================
#  Banc SimulationFerroviaire  —  OpenPLC + passerelle + vue 3D WebGL
# =============================================================================
#
#  Reprend l'organisation de GRFICSv3 : un réseau ICS à adresses fixes, chaque
#  rôle dans son conteneur, tout monte en une commande.
#
#  Différence de fond avec GRFICS : là-bas le procédé (réacteur chimique) est
#  l'autorité et l'automate lit ses capteurs. Ici c'est l'inverse — l'automate
#  produit les ordres, la simulation les applique. La passerelle est donc
#  cliente Modbus du runtime OpenPLC, et non un équipement d'E/S déporté.
#
#  Chaîne :
#      navigateur → webgl (nginx :80) → bridge → plc (Modbus :502)
#
#  Une seule origine est exposée au navigateur : nginx sert le build ET
#  relaie /ws et /data vers la passerelle, qui reste interne au réseau ICS.
#
#  Prérequis : le build Unity doit exister dans Build/WebGL avant de
#  construire l'image webgl.
#
#  Lancement :   docker compose up --build
#  Interfaces :  OpenPLC     http://localhost:8080   (openplc / openplc)
#                Vue 3D      http://localhost:8081
#                Données     http://localhost:8081/data
# =============================================================================

services:

  plc:
    build:
      # Contexte au dossier PLC/ pour embarquer simulation_ferroviaire.st
      context: .
      dockerfile: openplc/Dockerfile
      # Certains hôtes ne fournissent pas de DNS au conteneur de build.
      # Retirer cette ligne si votre Docker refuse le réseau hôte au build.
      network: host
    container_name: sf-plc
    hostname: plc
    ports:
      - "8080:8080"     # interface web OpenPLC
      - "502:502"       # serveur Modbus TCP
    volumes:
      # Seule la base est persistée : elle porte les réglages et les
      # utilisateurs. Le programme, lui, est compilé dans l'image — le monter
      # depuis l'hôte ne suffisait pas, il était perdu à chaque recréation.
      - plc_db:/opt/OpenPLC_v3/webserver/instance
    networks:
      ics:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped


  bridge:
    build:
      context: ./bridge
      network: host
    container_name: sf-bridge
    hostname: bridge
    depends_on:
      plc:
        condition: service_healthy
    environment:
      PLC_HOST: 172.28.0.2
      PLC_PORT: "502"
      PORT: "8081"
    # Aucun port publié : la passerelle n'est jointe que par nginx, à
    # l'intérieur du réseau ICS. Elle ne sert plus de fichiers non plus.
    expose:
      - "8081"
    networks:
      ics:
        ipv4_address: 172.28.0.3
    restart: unless-stopped


  webgl:
    build:
      # Contexte à la racine du projet pour atteindre Build/WebGL.
      # Le .dockerignore de la racine limite ce qui est envoyé au démon.
      context: ..
      dockerfile: PLC/webgl/Dockerfile
      network: host
    container_name: sf-webgl
    hostname: webgl
    depends_on:
      - bridge
    ports:
      - "8081:80"       # seule porte d'entrée du navigateur
    networks:
      ics:
        ipv4_address: 172.28.0.4
    restart: unless-stopped


networks:
  ics:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  plc_db:
