# =============================================================================
#  Service du build Unity WebGL, et relais vers la passerelle.
#
#  Tout passe par une seule origine : la page, les données et le WebSocket.
#  Ni CORS, ni contenu mixte, et l'adresse du WebSocket se déduit de celle de
#  la page — un seul build fonctionne partout.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de bloc « types » ici : en nginx il REMPLACE la table héritée au
    # lieu de l'étendre, et index.html se retrouvait servi en
    # application/octet-stream. La table par défaut de nginx 1.27 connaît
    # déjà application/wasm.

    # ---- Fichiers compressés par Unity ----
    # Le loader demande directement build.wasm.br ; sans Content-Encoding,
    # le navigateur reçoit du binaire compressé qu'il ne sait pas lire.
    location ~ \.(wasm|js|data|symbols\.json)\.br$ {
        add_header Content-Encoding br;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ \.(wasm|js|data|symbols\.json)\.gz$ {
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    # ---- Données de l'automate ----
    location /data {
        proxy_pass http://bridge:8081/data;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store";
    }

    # ---- Flux temps réel ----
    # La passerelle accepte la montée en WebSocket sur n'importe quel chemin :
    # /ws convient donc aussi bien derrière ce relais qu'en direct.
    location /ws {
        proxy_pass http://bridge:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Un WebSocket reste ouvert : sans ce délai, nginx le coupe au bout
        # de 60 s d'inactivité et la simulation passe en frein d'urgence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Build statique ----
    location / {
        try_files $uri $uri/ =404;
    }
}
